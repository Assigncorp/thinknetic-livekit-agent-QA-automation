[project]
name = "thinknetic-livekit-qa-api"
version = "0.1.0"
description = "API-layer tests for the Thinknetic/Etnyre public product endpoints"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
# No .pytest_cache in the project: every run starts from nothing (2026-09-28).
# xunit1 keeps per-test <properties> (the testing type) in the JUnit XML that
# tools/build_report.py turns into report/index.html.
junit_family = "xunit1"
testpaths = ["tests"]
# -p no:randomly and no -n by default on purpose. The API enforces 100 requests
# a minute across the WHOLE suite (see docs/api-test-strategy.md), so the quota
# accounting in conftest's `bucket` only holds while requests are serialised.
# Running these under xdist would make the throttling race itself.
addopts = "-p no:cacheprovider -ra --strict-markers -m 'not load'"
pythonpath = ["."]
markers = [
    "positive: testing type - the happy path works (config/test-types.json)",
    "negative: testing type - invalid input / misuse refused, wrong answers caught",
    "edge: testing type - boundaries, odd formats, timing, memory, parser corner cases",
    "security: testing type - auth, tampering, injection, unsafe requests, leaks",
    "nonfunctional: testing type - performance, rate limits, concurrency, audio quality",
    "smoke: fast checks that must pass before anything else runs",
    "live: hits the shared dev environment",
    "ratelimit: asserts the rate-limiter contract (cheap; a dozen requests)",
    "perf: samples latency and payload weight against budgets",
    "load: DELIBERATELY empties the rate-limit window - excluded by default, and gated again by RUN_RATE_LIMIT_SATURATION",
]
