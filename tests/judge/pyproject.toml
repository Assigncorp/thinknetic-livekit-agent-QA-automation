[project]
name = "thinknetic-livekit-qa-judge"
version = "0.1.0"
description = "Semantic scoring of the Etnyre agent's answers against its knowledge base, plus a LiveKit-SDK caller to produce them"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# The judge itself. Split out so the offline suite - rubric validation, KB
# grounding, anchor matching - installs and runs with no API account at all.
judge = [
    "anthropic>=1.0",
    "pydantic>=2.9",
]

# The LiveKit server API, for `make probe-agent` only - calls are driven by
# sdk/. Split out because it pulls native wheels.
live = [
    "livekit>=0.17",
    "livekit-api>=0.8",
    # python.org's macOS build has no CA bundle out of the box; see testbed.py.
    "certifi>=2024.1",
]

[tool.pytest.ini_options]
# No .pytest_cache in the project: every run starts from nothing (2026-09-28).
addopts = "-p no:cacheprovider"
# xunit1 keeps per-test <properties> (the testing type) in the JUnit XML that
# tools/build_report.py turns into report/index.html.
junit_family = "xunit1"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "positive: testing type - the happy path works (config/test-types.json)",
    "negative: testing type - invalid input / misuse refused, wrong answers caught",
    "edge: testing type - boundaries, odd formats, timing, memory, parser corner cases",
    "security: testing type - auth, tampering, injection, unsafe requests, leaks",
    "nonfunctional: testing type - performance, rate limits, concurrency, audio quality",
    "offline: no network and no API account - safe anywhere, runs on every PR",
    "judged: calls the judge model; needs ANTHROPIC_API_KEY and costs money",
]
