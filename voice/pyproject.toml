[project]
name = "thinknetic-livekit-qa-voice"
version = "0.1.0"
description = "LiveKit voice-agent tests (phase 3)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Installed only when the voice suite is switched on, so phase 1 stays light.
live = [
    "livekit>=0.17",
    "livekit-api>=0.8",
    "numpy>=2.1",
    "soundfile>=0.12",
    "webrtcvad>=2.0.10",
    "faster-whisper>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
