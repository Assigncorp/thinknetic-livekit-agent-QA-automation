- id: FHRC36-EMERGENCY-DRIVELINE-DISENGAGE
  model: FHRC36
  kb_file: 2026-08-17-FHRC36-VoiceAgent-Knowledge-Base.md
  kb_section: 'Q: Emergency — Machine is broken down in the road and cannot move'
  question: My machine broke down in the middle of the road and won't move at all. Is there an emergency way to get it moved?
  steps:
  - n: 1
    text: 'Install two 04MB x 04MJ fittings (Etnyre Part # 9410200) — one in each test port of the high-pressure distribution block bolted to the side of the drive pump (remove the 04MB plugs and install new fittings on both sides of the pump).'
    keywords:
    - term: fittings
      kind: term
      synonyms: []
    - term: test port
      kind: term
      synonyms: []
  - n: 2
    text: 'Install one 04 x 65-inch hydraulic hose with 04FJX fittings (Etnyre Part # 3181497) across between the two fittings. This creates a loop on the drive system, bypassing the pump and relief system.'
    keywords:
    - term: hose
      kind: term
      synonyms: []
    - term: loop
      kind: term
      synonyms:
      - bypass
      - bypasses
      - bypassing
      - bypassed
      - between the two
      - across the two
      - connect the two
  - n: 3
    text: Disable or release the park brake unit (mounted in front of the drive motor on the front axle).
    keywords:
    - term: park brake
      kind: term
      synonyms:
      - parking brake
    - term: Disable
      kind: term
      synonyms:
      - disabled
      - disabling
      - release the park brake
      - release the parking brake
      - releasing the park brake
      - releasing the parking brake
      - release the brake
      - park brake released
      - parking brake released
      - disengage the park brake
      - disengage the parking brake
      - drive motor
      - front axle
  - n: 4
    text: 'If the engine does NOT run (or the pump cannot supply brake release pressure): use a porta-power modified with a 04 FJX connection to supply approximately **280–400 PSI** to the parking brake unit to release it.'
    keywords:
    - term: does NOT run
      kind: term
      synonyms:
      - does not run
      - doesn't run
      - won't run
      - will not run
      - not running
