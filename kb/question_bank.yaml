entries:
- id: VHRS28-STARTUP-SEQUENCE
  model: VHRS28
  kb_file: 2026-08-07-vhrs28-voice-agent-knowledge-base.md
  kb_section: Step-by-Step Startup Sequence
  question: My walk-around checks are done. Can you take me through starting the machine up, in the right order?
  steps:
  - n: 1
    text: Verify Park/Drive switch (item 2 on panel) is in the **PARK** position. The engine will not start if the switch is in the Drive position.
    keywords:
    - term: PARK position
      kind: term
      synonyms:
      - in park
      - to park
      - on park
      - at park
      - into park
  - n: 2
    text: Verify the Speed/Direction joystick (item 9) is in the **neutral** position. If started without the joystick in neutral, the machine will not move until the joystick is returned to neutral.
    keywords:
    - term: joystick
      kind: term
      synonyms:
      - control handle
      - control stick
      - speed direction handle
      - speed and direction handle
      - speed direction lever
      - speed and direction lever
      - control lever
    - term: neutral
      kind: position
      synonyms: []
  - n: 3
    text: Turn the Throttle Run/Idle switch (item 37) to the **IDLE** position.
    keywords:
    - term: throttle
      kind: term
      synonyms:
      - run idle switch
      - run/idle switch
    - term: IDLE position
      kind: term
      synonyms:
      - to idle
      - low idle
      - in idle
      - on idle
      - at idle
      - into idle
  - n: 4
    text: Turn the Power/Ignition switch (item 1) to the **ON** position to supply power to all systems.
    keywords:
    - term: ignition
      kind: term
      synonyms:
      - key
      - power switch
    - term: 'ON'
      kind: position
      synonyms: []
  - n: 5
    text: Rotate the ignition switch further right to the **START** position to engage the starter. Release when the engine fires.
    keywords:
    - term: ignition
      kind: term
      synonyms:
      - key
      - starter
      - crank
    - term: START
      kind: position
      synonyms:
      - crank
      - cranking
  - n: 6
    text: Observe computer display — the main screen should appear showing application rate setpoint, aggregate size, and speed setpoint.
    keywords:
    - term: display
      kind: term
      synonyms:
      - screen
      - monitor
  - n: 7
    text: Allow engine to idle for a brief warm-up (especially in cold weather).
    keywords:
    - term: warm-up
      kind: term
      synonyms:
      - warm
      - warmup
      - warming
  - n: 8
    text: Move Throttle Run/Idle switch (item 37) to the **RUN** position to bring engine to high idle. The hydrostatic system is designed to operate at high idle.
    keywords:
    - term: throttle
      kind: term
      synonyms:
      - run idle switch
      - run/idle switch
    - term: RUN position
      kind: term
      synonyms:
      - to run
      - into run
      - in run
      - on run
      - high idle
  - n: 9
    text: Before moving, move Park/Drive switch to **DRIVE**, then verify the joystick responds correctly.
    keywords:
    - term: joystick
      kind: term
      synonyms:
      - control handle
      - control stick
      - speed direction handle
      - speed and direction handle
      - speed direction lever
      - speed and direction lever
      - control lever
    - term: to DRIVE
      kind: term
      synonyms:
      - into drive
      - in drive
      - on drive
      - drive position
      - select drive
      - selecting drive
      - over to drive
  cautions:
  - id: C1
    text: 'WARNING: Turning the ignition switch to "off" results in a violent stop. SHUT MACHINE OFF AND WAIT FOR ALL MOVEMENT TO STOP BEFORE LEAVING OPERATOR''S SEAT OR SERVICING. FAILURE TO DO SO COULD RESULT IN UNEXPECTED MOVEMENT AND CAUSE SERIOUS INJURY OR DEATH.'
    step: procedure
    keywords:
    - term: ignition
      kind: term
      synonyms:
      - key
    - term: violent stop
      kind: term
      synonyms:
      - violent
      - violently
      - sudden stop
      - abrupt stop
      - abruptly
      - hard stop
    - term: 'off'
      kind: position
      synonyms: []
  - id: C2
    text: 'WARNING: Selecting "park" while the chipspreader is moving results in a violent stop. Do not select "Park" unless the chipspreader is at a full stop.'
    step: procedure
    keywords:
    - term: park
      kind: term
      synonyms: []
    - term: violent stop
      kind: term
      synonyms:
      - violent
      - violently
      - sudden stop
      - abrupt stop
      - abruptly
      - hard stop
- id: VHRS28-HYDROSTATIC-WORK-STARTUP
  model: VHRS28
  kb_file: 2026-08-07-vhrs28-voice-agent-knowledge-base.md
  kb_section: After Hydrostatic System Work — Special Startup Procedure
  question: We just had a repair done that opened up the hydrostatic drive circuit. How do I get the machine started back up safely?
  steps:
  - n: 1
    text: Jack the machine up and support securely on stands with all four wheels off the ground.
    keywords:
    - term: jack
      kind: term
      synonyms:
      - jacked
      - jacking
      - lift
      - lifted
      - raise
      - raised
    - term: off the ground
      kind: term
      synonyms:
      - in the air
      - off the floor
      - clear of the ground
  - n: 2
    text: Disconnect the 50-pin connector at the engine so engine can only be cranked, not started.
    keywords:
    - term: 50-pin connector
      kind: term
      synonyms:
      - 50 pin
    - term: disconnect
      kind: term
      synonyms:
      - disconnecting
      - unplug
      - unplugging
      - unhook
      - detach
  - n: 3
    text: Disconnect pump stroker at the pump.
    keywords:
    - term: stroker
      kind: term
      synonyms: []
    - term: disconnect
      kind: term
      synonyms:
      - disconnecting
      - unplug
      - unplugging
      - unhook
      - detach
  - n: 4
    text: Install 600 PSI gauge in port "G" on the drive pump.
    keywords:
    - term: gauge
      kind: term
      synonyms:
      - gage
    - term: 600 PSI
      kind: value
      synonyms: []
  - n: 5
    text: Verify gate valve in suction tube is fully OPEN (counterclockwise). Do NOT attempt to start with gate valve closed — this causes cavitation damage.
    keywords:
    - term: gate valve
      kind: term
      synonyms:
      - suction valve
      - suction gate valve
      - suction tube valve
      - shutoff valve
    - term: OPEN
      kind: position
      synonyms:
      - opened
  - n: 6
    text: Crank engine with starter until 40–60 PSI charge pressure is seen on gauge. Do NOT crank for more than 30 seconds. Wait at least 2 minutes before cranking again.
    keywords:
    - term: crank
      kind: term
      synonyms:
      - cranking
      - starter
      - turn the engine over
      - turn it over
    - term: 40–60 PSI
      kind: value
      synonyms: []
  - n: 7
    text: Reconnect the 50-pin connector.
    keywords:
    - term: reconnect
      kind: term
      synonyms:
      - reconnecting
      - connect
      - plug back in
      - back in
      - reattach
      - hook back up
      - hook up
    - term: 50-pin connector
      kind: term
      synonyms:
      - 50 pin
  - n: 8
    text: Start engine normally; allow to idle for 10 minutes. Charge pressure may surge 50–500 PSI as system fills; this is normal. Pressure should settle to a steady reading.
    keywords:
    - term: idle
      kind: term
      synonyms:
      - idling
    - term: 10 minutes
      kind: value
      synonyms: []
  - n: 9
    text: Shut down engine; remove gauges; replace all plugs and caps. Recheck fluid levels after 15 minutes.
    keywords:
    - term: gauges
      kind: term
      synonyms:
      - gauge
      - gage
    - term: fluid levels
      kind: term
      synonyms:
      - fluid
      - fluids
      - oil level
      - levels
    - term: 15 minutes
      kind: value
      synonyms: []
  cautions:
  - id: C1
    text: 'CAUTION: Do not crank engine with gate valve closed. Doing so will cause damage to the hydraulic pumps.'
    step: procedure
    keywords:
    - term: gate valve
      kind: term
      synonyms:
      - suction valve
      - suction gate valve
      - suction tube valve
      - shutoff valve
    - term: closed
      kind: term
      synonyms:
      - shut
      - close
    - term: damage
      kind: term
      synonyms:
      - damaging
      - pump
      - cavitation
      - ruin
      - wreck
  - id: C2
    text: Do NOT attempt to start with gate valve closed — this causes cavitation damage.
    step: 5
    keywords:
    - term: gate valve
      kind: term
      synonyms:
      - suction valve
      - suction gate valve
      - suction tube valve
      - shutoff valve
    - term: closed
      kind: term
      synonyms:
      - shut
      - close
    - term: cavitation
      kind: term
      synonyms:
      - damage
      - damaging
      - pump
  - id: C3
    text: Do NOT crank for more than 30 seconds.
    step: 6
    keywords:
    - term: crank
      kind: term
      synonyms:
      - cranking
      - starter
    - term: 30 seconds
      kind: value
      synonyms: []
  - id: C4
    text: Wait at least 2 minutes before cranking again.
    step: 6
    keywords:
    - term: 2 minutes
      kind: value
      synonyms: []
- id: VHRS28-MACHINE-WONT-MOVE
  model: VHRS28
  kb_file: 2026-08-07-vhrs28-voice-agent-knowledge-base.md
  kb_section: 'Q: The machine will not move / won''t drive'
  question: The engine's running fine but the spreader won't go anywhere when I push the joystick. What should I check?
  steps:
  - n: 1
    text: 'Check start latch: The computer has a start-latch safety that prevents movement after computer startup. Place the Park/Drive switch in PARK, then place the joystick in neutral. Move Park/Drive switch to DRIVE. Now move the joystick — the machine should respond.'
    keywords:
    - term: start latch
      kind: term
      synonyms:
      - latch
      - lockout
      - lock out
      - locks out
      - interlock
    - term: joystick
      kind: term
      synonyms:
      - control handle
      - control stick
      - speed direction handle
      - speed and direction handle
      - control lever
    - term: neutral
      kind: position
      synonyms: []
  - n: 2
    text: 'Check speed setpoint: The speed setpoint may be set too low. Raise the setpoint by pushing the Speed Toggle Switch up or by pressing a Memory button. The display shows the new setpoint while changing.'
    keywords:
    - term: speed setpoint
      kind: term
      synonyms:
      - setpoint
      - set point
      - speed setting
      - set speed
    - term: raise
      kind: term
      synonyms:
      - raising
      - increase
      - turn up
      - bump up
      - higher
      - too low
  - n: 3
    text: 'Check brake pressure switch: The brake pressure switch may be stuck or failed. To test: Turn machine off. Unplug the electrical connector on the brake pressure switch (located on the hose from the foot pedal). Start the machine and attempt to move. WARNING: with the brake pressure switch unplugged, the service brake alone will not stop the machine. If the machine moves after unplugging, replace the brake pressure switch.'
    keywords:
    - term: brake pressure switch
      kind: term
      synonyms:
      - brake switch
      - brake pressure sensor
    - term: unplug
      kind: term
      synonyms:
      - unplugged
      - unplugging
      - disconnect
      - disconnected
  - n: 4
    text: 'Check for Joystick Fault: Check the display for "ALARM: JOYSTICK FAILURE." If shown, see the Joystick Fault section below.'
    keywords:
    - term: joystick failure
      kind: term
      synonyms:
      - joystick fault
      - joystick alarm
      - joystick error
  - n: 5
    text: 'Check for pump solenoid fault: If the machine moves forward but the display shows "PUMP REVERSE SOL FAILURE" when attempting reverse, there is an electrical disconnect between the computer and pump or between pump and ground. If it moves reverse but shows "PUMP FORWARD SOL FAILURE," same diagnosis. Find and repair the loose or broken connection.'
    keywords:
    - term: pump
      kind: term
      synonyms: []
    - term: solenoid
      kind: term
      synonyms:
      - sol
    - term: connection
      kind: term
      synonyms:
      - wiring
      - wire
      - connector
      - disconnect
  - n: 6
    text: 'Check charge pressure: Install a 1000 PSI gauge in port "G" on the drive pump. With engine at low idle, charge pressure should read approximately 400 PSI. If reading is near 0 PSI, the charge pump has failed. Contact Etnyre service at 888-586-1899.'
    keywords:
    - term: charge pressure
      kind: term
      synonyms: []
    - term: 400 PSI
      kind: value
      synonyms: []
  cautions:
  - id: C1
    text: 'WARNING: with the brake pressure switch unplugged, the service brake alone will not stop the machine.'
    step: 3
    keywords:
    - term: service brake
      kind: term
      synonyms:
      - brake pedal
      - foot brake
      - foot pedal
      - brake alone
      - brakes alone
    - term: will not stop
      kind: term
      synonyms:
      - won't stop
      - not stop
      - can't stop
      - cannot stop
      - won't be able to stop
      - not be able to stop
      - unable to stop
- id: VHRS28-AUGER-WONT-MOVE
  model: VHRS28
  kb_file: 2026-08-07-vhrs28-voice-agent-knowledge-base.md
  kb_section: 'Q: The auger won''t move'
  question: My auger quit turning. What should I check to get it going again?
  steps:
  - n: 1
    text: 'Check for stalled auger: You should hear noise from the hydraulic pump if the auger is jammed. Turn auger speed to 100%, then cycle the auger switch ON and OFF several times to break it free. WARNING: Do NOT attempt to clear a jam manually with the engine running.'
    keywords:
    - term: stalled
      kind: term
      synonyms:
      - stall
      - jammed
      - jam
      - stuck
    - term: ON and OFF
      kind: term
      synonyms:
      - off and on
      - cycle
      - cycling
      - toggle
    - term: 100%
      kind: value
      synonyms:
      - 100 percent
      - full speed
      - maximum speed
      - max speed
  - n: 2
    text: 'Check auger speed setting: Adjust auger speed to a higher percentage on the calibration screen. Normal use is around 75%.'
    keywords:
    - term: auger speed
      kind: term
      synonyms:
      - speed
      - calibration screen
    - term: higher
      kind: term
      synonyms:
      - raise
      - raising
      - increase
      - increasing
      - turn up
      - turn it up
      - bump up
      - bump it up
      - too low
  - n: 3
    text: 'Check for start latch: Move the joystick to neutral and place the Park/Drive switch in PARK. The auger should now function properly.'
    keywords:
    - term: joystick
      kind: term
      synonyms:
      - control handle
      - control stick
      - speed direction handle
      - speed and direction handle
      - control lever
    - term: neutral
      kind: position
      synonyms: []
    - term: in PARK
      kind: term
      synonyms:
      - to park
      - into park
      - on park
      - park position
      - select park
  - n: 4
    text: 'Check auto switch (if in AUTO mode): Check the auto diaphragm switch for holes in the diaphragm (most common failure). Ensure material is not touching the switch. Check that the electrical signal from the auto switch is returning to the computer — inspect connections.'
    keywords:
    - term: diaphragm
      kind: term
      synonyms:
      - auto switch
    - term: holes
      kind: term
      synonyms:
      - hole
      - punctured
      - puncture
      - torn
      - tear
      - tears
  cautions:
  - id: C1
    text: 'WARNING: Do NOT attempt to clear a jam manually with the engine running.'
    step: 1
    keywords:
    - term: jam
      kind: term
      synonyms:
      - jammed
      - clear it
      - clearing
    - term: engine running
      kind: term
      synonyms:
      - running
      - engine on
      - engine is on
      - engine off
      - shut the engine off
      - shut off the engine
- id: VHRS28-AUX-HYDRAULIC-PRESSURE-WONT-RELIEVE
  model: VHRS28
  kb_file: 2026-08-07-vhrs28-voice-agent-knowledge-base.md
  kb_section: 'Q: Auxiliary hydraulic pressure will not relieve / engine is hard to start after shutdown'
  question: After I shut down, the auxiliary hydraulic pressure doesn't bleed off and the engine is really hard to restart. How do I fix that?
  steps:
  - n: 1
    text: Shut off machine and close main suction valve.
    keywords:
    - term: suction valve
      kind: term
      synonyms:
      - suction
    - term: close
      kind: position
      synonyms:
      - closed
      - shut the suction valve
      - shut the main suction valve
  - n: 2
    text: Locate and cap the case drain at the pump.
    keywords:
    - term: case drain
      kind: term
      synonyms: []
    - term: cap
      kind: term
      synonyms:
      - capped
      - plug it
      - plug off
  - n: 3
    text: Remove the compensator from the hydraulic pump(s).
    keywords:
    - term: compensator
      kind: term
      synonyms: []
    - term: hydraulic pump
      kind: term
      synonyms:
      - pump
  - n: 4
    text: Remove the load sense compensator cartridge.
    keywords:
    - term: cartridge
      kind: term
      synonyms: []
    - term: remove
      kind: term
      synonyms:
      - removing
      - take out
      - pull out
      - take the cartridge out
      - pull the cartridge
      - take off
  - n: 5
    text: Locate the 2mm Allen head orifice inside the compensator housing.
    keywords:
    - term: orifice
      kind: term
      synonyms: []
    - term: Allen
      kind: term
      synonyms:
      - 2mm
      - 2 mm
      - 2 millimeter
      - hex
  - n: 6
    text: 'Remove the orifice and clean it: Use a strand of primary wire or a torch cleaning kit (if small enough) to clean the orifice passage. DO NOT enlarge the orifice.'
    keywords:
    - term: orifice
      kind: term
      synonyms: []
    - term: clean
      kind: term
      synonyms:
      - cleaning
      - cleaned
  - n: 7
    text: Reinstall orifice, cartridge, and compensator.
    keywords:
    - term: reinstall
      kind: term
      synonyms:
      - reinstalling
      - reinstalled
      - install
      - put back
      - back in
      - back
      - reassemble
    - term: cartridge
      kind: term
      synonyms: []
  - n: 8
    text: Uncap and reinstall the case drain hose.
    keywords:
    - term: case drain
      kind: term
      synonyms: []
    - term: uncap
      kind: term
      synonyms:
      - reinstall
      - reconnect
      - remove the cap
      - take the cap off
      - hook back up
      - back on
  - n: 9
    text: Open the suction valve.
    keywords:
    - term: suction valve
      kind: term
      synonyms:
      - suction
    - term: OPEN
      kind: position
      synonyms:
      - opened
  - n: 10
    text: 'Pressurize the hydraulic tank: Install an air regulator to the hydraulic tank through the vent filter connection. Apply 3–5 PSI to push out any trapped air. Start the machine and operate all hydraulic functions to circulate oil. Check and adjust pressures per M-215-16 Appendix D.'
    keywords:
    - term: hydraulic tank
      kind: term
      synonyms:
      - tank
      - reservoir
    - term: 3–5 PSI
      kind: value
      synonyms: []
  cautions:
  - id: C1
    text: DO NOT enlarge the orifice.
    step: 6
    keywords:
    - term: enlarge
      kind: term
      synonyms:
      - enlarging
      - bigger
      - widen
      - widening
      - drill it out
      - drill out
      - ream
