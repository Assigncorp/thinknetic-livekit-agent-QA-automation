- id: FHRC36-TOWING
  model: FHRC36
  kb_file: 2026-08-17-FHRC36-VoiceAgent-Knowledge-Base.md
  kb_section: Towing Instructions
  question: Our engine quit and we have to tow the chip spreader. How do I get it ready to be towed?
  steps:
  - n: 1
    text: Install a chain or strap around the front hydrostatic motor and parking brake assembly. Secure to the front engine crossmember.
    keywords:
    - term: chain
      kind: term
      synonyms:
      - strap
    - term: crossmember
      kind: term
      synonyms:
      - cross member
  - n: 2
    text: Remove four 16mm bolts securing the parking brake to the front axle. Pull the parking brake and motor assembly away from the front axle to disengage the spline.
    keywords:
    - term: bolts
      kind: term
      synonyms: []
    - term: front axle
      kind: term
      synonyms:
      - axle
  - n: 3
    text: 'On 4WD: secure rear motor to frame crossmember and remove in same manner.'
    keywords:
    - term: 4WD
      kind: term
      synonyms:
      - 4 wheel drive
      - four wheel drive
      - all wheel drive
      - 4x4
    - term: rear
      kind: term
      synonyms: []
  - n: 4
    text: Tow only to a loading area — not recommended for long distances.
    keywords:
    - term: loading area
      kind: term
      synonyms:
      - loading
      - load it
      - trailer
    - term: long distances
      kind: term
      synonyms:
      - distance
  - n: 5
    text: 'When returning to service: verify axle differential housings are filled with SAE 90 API GL-5 gear lube.'
    keywords:
    - term: differential
      kind: term
      synonyms:
      - diff
