name: QA automation

# Every push and PR - fast, and it VALIDATES THE AGENT with a real call:
#
#   offline ──► api ──► livekit-contract ──► agent ──► report
#
# agent (configurable, default `smoke`):
#   smoke  ONE real call (~2 min): the agent joins, greets the caller by name,
#          names the serial's machine, answers a KB question - every figure it
#          states judged against resources/kb by the oracle, no model - and hangs up
#   kb     smoke + the KB run: every anchored FAQ + procedures, ~48 calls (~18 min)
#   full   make live-parallel: every live test, KB-judged (~45 min)
#   none   skip (e.g. a docs-only change)
#
# Optional, configurable, off by default:
#   ui     browser tests: none | smoke | no-live | live   (after api, beside the contract)
#   extra  any make targets, e.g. "livekit-auth perf" or "livekit-grounding"
#
# Where each choice comes from, first match wins:
#   1. Run workflow (workflow_dispatch) inputs
#   2. repository variables CI_AGENT / CI_UI / CI_EXTRA  (Settings -> Secrets and variables
#      -> Actions -> Variables) - this is how a push / PR turns them on
#   3. none
#
# Everything that calls the agent (agent, `ui: live`, live `extra` targets)
# shares one concurrency group with live.yml, so the shared agent never sees
# more than one live run; runs queue rather than cancel. A PR from a fork gets
# no secrets - the agent job then says so and skips instead of failing.
#
# The report job merges every job's report/ and publishes both reports:
#   qa-report        index.html + playwright/ (+ raw data)
#   qa-report-share  qa-report.html - ONE self-contained file to send

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent validation (real calls)
        type: choice
        options: [smoke, kb, full, none]
        default: smoke
      ui:
        description: Browser tests
        type: choice
        options: [none, smoke, no-live, live]
        default: none
      extra:
        description: Extra make targets, space-separated (e.g. "livekit-auth perf")
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://etnyre-dev.thinknetic.app
  ORG_SLUG: e
  PRODUCT_SLUG: chip-spreader
  PYTHONDONTWRITEBYTECODE: '1'
  UV_FROZEN: '1' # install exactly the lockfile - no resolution step

jobs:
  # No deployment, no credentials, no network: the scenario catalogue, the
  # oracle's regression suite, the SDK suite's data, and "every test has a
  # testing type". A KB edited without `make resources` is caught here.
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/*/uv.lock'
      - name: Scenario catalogue
        working-directory: tests/api
        run: uv run pytest tests/test_scenario_catalog.py -q --junitxml=../../report/data/junit/catalog.xml
      - name: Judge + oracle
        working-directory: tests/judge
        run: uv run pytest -q -m offline --junitxml=../../report/data/junit/judge-offline.xml
      - name: LiveKit SDK data
        working-directory: tests/sdk
        run: uv run pytest -q -m offline --junitxml=../../report/data/junit/livekit-offline.xml
      - name: Every test has a testing type
        run: |
          for suite in api judge sdk; do
            (cd tests/$suite && TEST_TYPES_STRICT=1 LKQA_NO_REPORT=1 uv run pytest --collect-only -q > /dev/null) || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-offline
          path: report/
          if-no-files-found: ignore

  api:
    name: API suite
    runs-on: ubuntu-latest
    needs: offline
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/*/uv.lock'
      - run: uv run pytest -q --junitxml=../../report/data/junit/api.xml
        working-directory: tests/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-api
          path: report/
          if-no-files-found: ignore

  # Mints session tokens and reads them; never joins, so no agent is started.
  livekit-contract:
    name: LiveKit session contract
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/*/uv.lock'
      - run: uv run pytest -q -rs -m contract --junitxml=../../report/data/junit/livekit-contract.xml
        working-directory: tests/sdk
        env:
          LKQA_REPORT_TAG: livekit-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-livekit-contract
          path: report/
          if-no-files-found: ignore

  # REAL AGENT CALLS - the check that the answers come from the knowledge base.
  agent:
    name: Agent validation (${{ inputs.agent || vars.CI_AGENT || 'smoke' }})
    if: (inputs.agent || vars.CI_AGENT || 'smoke') != 'none'
    runs-on: ubuntu-latest
    needs: livekit-contract
    timeout-minutes: 90
    concurrency:
      group: live-agent-calls
      cancel-in-progress: false
    env:
      LEVEL: ${{ inputs.agent || vars.CI_AGENT || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/*/uv.lock'
      - name: .env from repository secrets
        id: env
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$LIVEKIT_URL" ]; then
            echo "::warning::no LIVEKIT_* secrets (fork PR, or not set yet) - agent validation skipped"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          : > .env
          for k in BASE_URL ORG_SLUG PRODUCT_SLUG LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET OPENAI_API_KEY GROQ_API_KEY; do
            [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}" >> .env
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: One real call, KB-judged
        if: steps.env.outputs.ready == 'true' && (env.LEVEL == 'smoke' || env.LEVEL == 'kb')
        working-directory: tests/sdk
        env:
          LKQA_REPORT_TAG: livekit-conversation
        run: uv run pytest -v -rs -s tests/test_conversation.py --junitxml=../../report/data/junit/livekit-conversation.xml
      - name: KB run - every FAQ + procedures
        if: steps.env.outputs.ready == 'true' && env.LEVEL == 'kb'
        working-directory: tests/sdk
        env:
          LKQA_REPORT_TAG: livekit-kb
        run: uv run pytest -v -rs -s -m kbrun --junitxml=../../report/data/junit/livekit-kb.xml
      - name: Every live test (make live-parallel)
        if: steps.env.outputs.ready == 'true' && env.LEVEL == 'full'
        run: |
          npm install -g pnpm@10 > /dev/null
          make install && (cd tests/ui && pnpm exec playwright install-deps chromium)
          make live-parallel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-agent
          path: report/
          if-no-files-found: ignore

  # OPTIONAL. Beside the contract (not after it), so turning it on does not
  # lengthen the default chain.
  ui:
    name: Browser tests (${{ inputs.ui || vars.CI_UI || 'none' }})
    if: (inputs.ui || vars.CI_UI || 'none') != 'none'
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 30
    concurrency:
      # Only `live` touches the shared agent - it queues behind live.yml runs.
      group: ${{ (inputs.ui || vars.CI_UI) == 'live' && 'live-agent-calls' || format('ui-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      UI: ${{ inputs.ui || vars.CI_UI }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: tests/ui
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tests/ui
      - name: Every browser test has a testing type
        working-directory: tests/ui
        run: pnpm exec playwright test --list --reporter=json | python3 ../../tools/check_test_types.py
      - name: .env for live calls
        if: env.UI == 'live'
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          for k in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}" >> .env
          done
      - name: Run
        working-directory: tests/ui
        run: |
          case "$UI" in
            smoke)   pnpm exec playwright test --grep @smoke ;;
            no-live) pnpm exec playwright test --grep-invert @live ;;
            live)    pnpm exec playwright test --grep @live --workers 1 ;;
            *)       echo "::error::unknown ui choice '$UI' (none | smoke | no-live | live)"; exit 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-ui
          path: report/
          if-no-files-found: ignore

  # OPTIONAL. Any make targets - `make help` lists them. Live ones (livekit-*,
  # chat, all-parallel ...) need the secrets and queue behind live.yml.
  extra:
    name: Extra (${{ inputs.extra || vars.CI_EXTRA }})
    if: (inputs.extra || vars.CI_EXTRA || '') != ''
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 150
    concurrency:
      group: live-agent-calls
      cancel-in-progress: false
    env:
      TARGETS: ${{ inputs.extra || vars.CI_EXTRA }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'tests/*/uv.lock'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tests/ui/pnpm-lock.yaml
      - name: .env from repository secrets
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          : > .env
          for k in BASE_URL ORG_SLUG PRODUCT_SLUG LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET OPENAI_API_KEY GROQ_API_KEY; do
            [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}" >> .env
          done
      - name: Install
        run: make install && (cd tests/ui && pnpm exec playwright install-deps chromium)
      - name: make ${{ env.TARGETS }}
        run: make $TARGETS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-extra
          path: report/
          if-no-files-found: ignore

  report:
    name: Reports (HTML + Playwright + shareable)
    runs-on: ubuntu-latest
    needs: [offline, api, livekit-contract, agent, ui, extra]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: report
          merge-multiple: true
      - name: Build the combined report
        run: python3 tools/build_report.py && cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: report/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: qa-report-share
          path: report/qa-report.html
          retention-days: 14
          if-no-files-found: ignore
      # A skipped optional job is fine; a failed one fails the run.
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::a job failed - see the summary above and the qa-report artifact"
          exit 1
