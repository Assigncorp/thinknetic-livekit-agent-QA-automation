# Weekday static check of the agent's settings.yaml. The file lives in
# Assigncorp/thinknetic-livekit-agents and is checked out fresh on every run - it is
# never copied into this repo. No calls are placed (live checks are a later phase).
#
# Needs the repository secret AGENTS_REPO_READ_TOKEN: a fine-grained token with
# Contents: read on thinknetic-livekit-agents only (the repo is private). TRANSFER_TEST_NUMBERS (repo
# variable, comma-separated E.164) turns on the check that no real desk number is
# committed to the nonprod config; without it that one test is skipped.
#
# Schedule: Monday to Friday, 08:00 IST = 02:30 UTC (IST is UTC+5:30, so the weekday is the same in both). GitHub runs schedules only from the default
# branch, so it starts once this file is on master; use Run workflow until then.
name: settings-daily

on:
  # Also on every push that touches the tests, so a change here is proven in CI.
  push:
    branches: [develop-phase1_basic]
    paths:
      - ".github/workflows/settings-daily.yml"
      - "tests/sdk/tests/test_settings_static.py"
      - "tests/sdk/lkqa/settings_model.py"
      - "tests/sdk/lkqa/cronwindow.py"
      - "kb/settings_expectations.yaml"
  schedule:
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      agents_ref:
        description: "Agent repo branch/tag/SHA to test (blank = develop)"
        required: false

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_SRC: ${{ github.workspace }}/agents-src
      TRANSFER_TEST_NUMBERS: ${{ vars.TRANSFER_TEST_NUMBERS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the agent-repo token is set
        env:
          TOKEN: ${{ secrets.AGENTS_REPO_READ_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::secret AGENTS_REPO_READ_TOKEN is not set (fine-grained token, Contents: read on Assigncorp/thinknetic-livekit-agents)"; exit 1; }

      - name: Fetch the agent repo (config only)
        uses: actions/checkout@v4
        with:
          repository: Assigncorp/thinknetic-livekit-agents
          ref: ${{ inputs.agents_ref || 'develop' }}
          token: ${{ secrets.AGENTS_REPO_READ_TOKEN }}
          path: agents-src
          sparse-checkout: src/assistants/product_support/config
          fetch-depth: 1

      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: false }
      - run: make install

      - name: Static settings checks
        run: |
          echo "agent commit: $(git -C agents-src rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          make settings

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-daily-${{ github.run_number }}
          path: report-internal/junit-settings.xml
