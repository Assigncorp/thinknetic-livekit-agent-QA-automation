name: Live agent calls

# The suites that hold REAL calls with the agent on the shared dev deployment:
# the LiveKit SDK suite (grounding, KB correctness, LLM interview, voice,
# resilience, concurrency) and, for `all`, the API and full browser suites too.
# Runs `make live-parallel` / `make livekit-sdk` / `make all-parallel`: waves, never more than 3 live
# calls at once (the limit approved for the shared deployment).
#
# On demand only (Actions -> Live agent calls -> Run workflow). It makes ~100
# agent calls and the interview's LLM calls are billed to OPENAI_API_KEY, so it
# is never triggered by a push. To run it nightly, uncomment `schedule`.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET   required - observe rooms, auth tests
#   OPENAI_API_KEY                                     the interview's LLM (or GROQ_API_KEY)
#   GROQ_API_KEY                                       optional - tried first when set
#
# Output: artifact qa-report-live - index.html (combined), playwright/,
# kb-correctness.md, interview.md, every call's transcript in recordings/, one
# log per lane in logs/ - and the totals on the run's summary page.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: What to run
        type: choice
        options:
          - live  # real agent calls only, KB-judged, no offline checks (make live-parallel, ~45 min)
          - sdk   # the LiveKit SDK suite + the browser<->LiveKit specs (~35 min)
          - all   # every suite: api, judge, sdk, full browser suite (~45 min)
        default: sdk
  # schedule:
  #   - cron: '0 3 * * *'   # 03:00 UTC, outside working hours

# One live run at a time, repo-wide: two would put 6 calls on the agent.
concurrency:
  group: live-agent-calls
  cancel-in-progress: false

env:
  BASE_URL: https://etnyre-dev.thinknetic.app
  ORG_SLUG: e
  PRODUCT_SLUG: chip-spreader
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  live:
    name: Live calls (${{ inputs.profile || 'sdk' }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Values go straight from secrets into .env (gitignored, never uploaded);
      # nothing is echoed, and Actions masks secret values in the log anyway.
      - name: Write .env from repository secrets
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=""
          for k in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          [ -n "$OPENAI_API_KEY$GROQ_API_KEY" ] || echo "::warning::no OPENAI_API_KEY or GROQ_API_KEY - the LLM interview will skip"
          : > .env
          for k in BASE_URL ORG_SLUG PRODUCT_SLUG LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET OPENAI_API_KEY GROQ_API_KEY; do
            [ -n "${!k}" ] && printf '%s=%s\n' "$k" "${!k}" >> .env
          done
          echo "wrote .env with $(wc -l < .env) keys"

      - name: Install
        run: |
          make install
          cd ui && npx playwright install-deps chromium

      - name: Run (${{ inputs.profile || 'sdk' }})
        id: run
        continue-on-error: true
        run: |
          case "${{ inputs.profile || 'sdk' }}" in
            all)  make all-parallel ;;
            live) make live-parallel ;;
            *)    make livekit-sdk ;;
          esac

      - name: Summary
        if: always()
        run: |
          [ -f report/summary.md ] || python3 tools/build_report.py
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f report/kb-correctness.md ]; then
            { echo; echo "<details><summary>KB correctness table</summary>"; echo; cat report/kb-correctness.md; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-live
          path: report/
          retention-days: 30

      # The one file to send: self-contained, tokens and keys redacted.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-share
          path: report/qa-report.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Fail the job if any test failed
        if: steps.run.outcome != 'success'
        run: |
          echo "::error::test failures - see the summary above and the qa-report-live artifact"
          exit 1
