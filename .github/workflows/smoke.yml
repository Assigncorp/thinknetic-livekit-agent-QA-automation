# The agent QA workflow: unit checks, settings checks and the live LiveKit KB-steps call,
# with a published HTML report on every run that makes a call, pass or fail. The published
# report (report/) is the phone-call check only; the unit checks go to report-internal/,
# which is kept as a separate artifact and never published to Pages.
#
# Secrets come from repository secrets (LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET,
# SMS_TEST_PHONE) and are never printed.
# GitHub Pages must be enabled with Source = "GitHub Actions" (Settings > Pages).
#
# Triggers and suites:
#   schedule  - Monday to Friday at 06:00 IST, always the smoke suite. GitHub only runs scheduled
#               workflows from the repository's default branch, so the schedule does nothing
#               until this file is on it.
#   push      - every push to any branch, always the smoke suite.
#   manual    - Actions tab > qa > Run workflow, pick the suite:
#                 smoke     unit + settings + live call (the same as the scheduled run)
#                 unit      unit checks only (offline)
#                 settings  settings checks only (agent repo's settings.yaml)
#                 live      live call only
#
# Settings checks read the agent repo's settings.yaml fresh from
# Assigncorp/thinknetic-livekit-agents with the SETTINGFILE_FINEGRAINED_TOKEN secret
# (Contents read on that repo only). Every stage in the suite must pass.
name: qa
run-name: ${{ inputs.suite || 'smoke' }} (${{ github.event_name }}) - ${{ github.ref_name }}

on:
  push:
    branches: ["**"]
  # Scheduled smoke: Monday to Friday, 06:00 IST = 00:30 UTC (five fields, UTC: minute hour
  # day-of-month month day-of-week). IST is UTC+5:30, so the weekday is the same in both.
  schedule:
    - cron: "30 0 * * 1-5"
  workflow_dispatch:
    inputs:
      suite:
        description: "Test type to run"
        type: choice
        default: smoke
        options:
          - smoke
          - unit
          - settings
          - live
      kb_seed:
        description: "KB_SEED - reproduce a run's model and question (blank = random)"
        required: false
      kb_model:
        description: "KB_MODEL - pin the model: VHRS28, FHRC28, VHRS36 or FHRC36 (blank = FHRC28 or FHRC36 at random)"
        required: false
      kb_image:
        description: "KB_IMAGE - pin the image asked for, by its description in kb/images.yaml (blank = random)"
        required: false
      kb_question_id:
        description: "KB_QUESTION_ID - pin one question bank entry (blank = random)"
        required: false
      kb_pass_threshold:
        description: "KB_PASS_THRESHOLD - share of KB steps and cautions that must match, 0 to 1 (blank = 0.95)"
        required: false

# One run at a time: the live call uses the shared dev agent.
concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      publish: ${{ steps.plan.outputs.kb }}
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      AGENT_NAME: thinknetic-agents-nonprod
      KB_SEED: ${{ inputs.kb_seed }}
      KB_MODEL: ${{ inputs.kb_model }}
      KB_QUESTION_ID: ${{ inputs.kb_question_id }}
      KB_IMAGE: ${{ inputs.kb_image }}
      KB_PASS_THRESHOLD: ${{ inputs.kb_pass_threshold }}
      SMS_TEST_PHONE: ${{ secrets.SMS_TEST_PHONE }}
      AGENT_SRC: ${{ github.workspace }}/agents-src
      TRANSFER_TEST_NUMBERS: ${{ vars.TRANSFER_TEST_NUMBERS }}
      KB_RETRIES: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Which stages this suite runs. Push and schedule have no inputs, so they get smoke.
      - name: Plan the suite
        id: plan
        run: |
          suite="${{ inputs.suite || 'smoke' }}"
          case "$suite" in
            smoke)    unit=true;  settings=true;  kb=true ;;
            unit)     unit=true;  settings=false; kb=false ;;
            settings) unit=false; settings=true;  kb=false ;;
            live)     unit=false; settings=false; kb=true ;;
            *) echo "::error::unknown suite '$suite'"; exit 1 ;;
          esac
          { echo "suite=$suite"; echo "unit=$unit"; echo "settings=$settings"; echo "kb=$kb"; } >> "$GITHUB_OUTPUT"
          echo "suite=$suite unit=$unit settings=$settings kb=$kb"

      # Without these the live test skips instead of failing, which would look like a pass.
      - name: Check the LiveKit secrets are set
        if: steps.plan.outputs.kb == 'true'
        run: |
          for v in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET SMS_TEST_PHONE; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          test -z "${missing:-}"

      - name: Check the agent-repo token is set
        if: steps.plan.outputs.settings == 'true'
        env:
          TOKEN: ${{ secrets.SETTINGFILE_FINEGRAINED_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::repository secret SETTINGFILE_FINEGRAINED_TOKEN is not set"; exit 1; }

      # Always the agent team's latest settings - never a copy kept in this repo.
      # A failed fetch must not stop the unit checks and the live call: the settings stage
      # below then fails on its own, with the reason, and the verdict stays red.
      - name: Fetch the agent repo (config only)
        id: agentsrc
        if: steps.plan.outputs.settings == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Assigncorp/thinknetic-livekit-agents
          ref: develop
          token: ${{ secrets.SETTINGFILE_FINEGRAINED_TOKEN }}
          path: agents-src
          sparse-checkout: src/assistants/product_support/config
          fetch-depth: 1

      - name: Start the clock
        run: echo "SMOKE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Clean slate (no caches, no old report)
        run: |
          uv cache clean || true
          find report -mindepth 1 ! -name .gitkeep -exec rm -rf {} + 2>/dev/null || true
          rm -rf report-internal
          mkdir -p report/data report-internal

      - name: Install fresh (uv sync)
        run: make install

      # The agent runs on LiveKit Cloud; the live call reads its worker logs with `lk agent logs`.
      - name: Install the LiveKit CLI
        if: steps.plan.outputs.kb == 'true'
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          lk --version

      - name: Unit checks (routing, validator, question bank)
        id: unit
        if: steps.plan.outputs.unit == 'true'
        continue-on-error: true
        run: make unit

      - name: Settings checks (agent repo's settings.yaml)
        id: settings
        if: steps.plan.outputs.settings == 'true'
        continue-on-error: true
        run: |
          if [ "${{ steps.agentsrc.outcome }}" != success ]; then
            echo "::error::could not read Assigncorp/thinknetic-livekit-agents - check that SETTINGFILE_FINEGRAINED_TOKEN has Contents: read on that repo (and is approved for the org)"
            exit 1
          fi
          echo "agent commit: $(git -C agents-src rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          make settings

      # In smoke, a unit failure stops the run before the live call.
      - name: LiveKit KB-steps call
        id: kb
        if: steps.plan.outputs.kb == 'true' && (steps.plan.outputs.unit != 'true' || steps.unit.outcome == 'success')
        continue-on-error: true
        run: make kb

      - name: Build the HTML report
        if: always()
        run: make report

      - name: Keep this run's report as an artifact
        if: always() && steps.plan.outputs.kb == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.suite }}-report-${{ github.run_number }}
          path: report/
          if-no-files-found: warn

      - name: Keep the internal unit-check report (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-unit-checks-${{ github.run_number }}
          path: report-internal/
          if-no-files-found: warn

      # Only runs with a live call publish, so a unit- or settings-only run never replaces
      # the latest call report on Pages with an empty one.
      - name: Stage the report for GitHub Pages
        if: always() && steps.plan.outputs.kb == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/

      # A stage outside the suite is skipped and not counted; every stage in it must pass.
      - name: Verdict
        if: always()
        run: |
          echo "suite=${{ steps.plan.outputs.suite }} unit=${{ steps.unit.outcome }} settings=${{ steps.settings.outcome }} kb=${{ steps.kb.outcome }}"
          {
            echo "## QA run: ${{ steps.plan.outputs.suite }}"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit checks | ${{ steps.unit.outcome || 'not in suite' }} |"
            echo "| Settings checks | ${{ steps.settings.outcome || 'not in suite' }} |"
            echo "| LiveKit KB-steps call | ${{ steps.kb.outcome || 'not in suite' }} |"
            echo ""
            if [ "${{ steps.plan.outputs.kb }}" = true ]; then
              echo "Report: see the **publish** job below for the link, or download the \`${{ steps.plan.outputs.suite }}-report-${{ github.run_number }}\` artifact."
            else
              echo "Results: download the \`internal-unit-checks-${{ github.run_number }}\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          if [ "${{ steps.plan.outputs.unit }}" = true ] && [ "${{ steps.unit.outcome }}" != success ]; then status=1; fi
          if [ "${{ steps.plan.outputs.settings }}" = true ] && [ "${{ steps.settings.outcome }}" != success ]; then status=1; fi
          if [ "${{ steps.plan.outputs.kb }}" = true ] && [ "${{ steps.kb.outcome }}" != success ]; then status=1; fi
          exit $status

  publish:
    needs: qa
    if: always() && needs.qa.result != 'cancelled' && needs.qa.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the report (latest call run only)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the report in the job summary
        run: |
          {
            echo "## ${{ needs.qa.outputs.suite }} report"
            echo ""
            echo "**[Open the report](${{ steps.deployment.outputs.page_url }})** - ${{ needs.qa.outputs.suite }} run ${{ needs.qa.result == 'success' && 'PASSED' || 'FAILED' }}"
          } >> "$GITHUB_STEP_SUMMARY"
