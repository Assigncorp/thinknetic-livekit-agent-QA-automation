# The agent smoke test: unit checks, then one live LiveKit KB-steps call - and a
# published HTML report on every run, pass or fail. The published report (report/)
# is the phone-call check only; the unit checks go to report-internal/, which is
# kept as a separate artifact and never published to Pages.
#
# Same steps as `make smoke`. Secrets come from repository secrets
# (LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET, SMS_TEST_PHONE) and are never printed.
# GitHub Pages must be enabled with Source = "GitHub Actions" (Settings > Pages).
#
# Triggers: every push to develop-phase1_basic, on demand from the Actions tab, and
# a schedule that is OFF until a time is chosen (see `schedule` below). GitHub only
# runs scheduled workflows from the repository's default branch, so the schedule
# does nothing until this file is on master.
name: smoke

on:
  push:
    branches: [develop-phase1_basic]
  # Scheduled run - placeholder, not active. To turn on: set the cron time below
  # (five fields, UTC: minute hour day-of-month month day-of-week), uncomment the
  # two lines, and merge to the default branch. IST is UTC+5:30.
  # schedule:
  #   - cron: "<MINUTE> <HOUR> * * <DAYS>"   # TODO: choose the run time
  workflow_dispatch:
    inputs:
      kb_seed:
        description: "KB_SEED - reproduce a run's model and question (blank = random)"
        required: false
      kb_model:
        description: "KB_MODEL - pin the model: VHRS28, FHRC28, VHRS36 or FHRC36 (blank = random)"
        required: false
      kb_question_id:
        description: "KB_QUESTION_ID - pin one question bank entry (blank = random)"
        required: false
      kb_pass_threshold:
        description: "KB_PASS_THRESHOLD - share of KB steps and cautions that must match, 0 to 1 (blank = 0.95)"
        required: false

# One smoke run at a time: the live call uses the shared dev agent.
concurrency:
  group: smoke
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      AGENT_NAME: thinknetic-agents-nonprod
      KB_SEED: ${{ inputs.kb_seed }}
      KB_MODEL: ${{ inputs.kb_model }}
      KB_QUESTION_ID: ${{ inputs.kb_question_id }}
      KB_PASS_THRESHOLD: ${{ inputs.kb_pass_threshold }}
      SMS_TEST_PHONE: ${{ secrets.SMS_TEST_PHONE }}
      KB_RETRIES: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # Without these the live test skips instead of failing, which would look like a pass.
      - name: Check the LiveKit secrets are set
        run: |
          for v in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET SMS_TEST_PHONE; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          test -z "${missing:-}"

      - name: Start the clock
        run: echo "SMOKE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Clean slate (no caches, no old report)
        run: |
          uv cache clean || true
          find report -mindepth 1 ! -name .gitkeep -exec rm -rf {} + 2>/dev/null || true
          rm -rf report-internal
          mkdir -p report/data report-internal

      - name: Install fresh (uv sync)
        run: make install

      # The agent runs on LiveKit Cloud; the live call reads its worker logs with `lk agent logs`.
      - name: Install the LiveKit CLI
        run: |
          curl -sSL https://get.livekit.io/cli | bash
          lk --version

      - name: Unit checks (routing, validator, question bank)
        id: unit
        continue-on-error: true
        run: make unit

      - name: LiveKit KB-steps call
        id: kb
        if: steps.unit.outcome == 'success'
        continue-on-error: true
        run: make kb

      - name: Build the HTML report
        if: always()
        run: make report

      - name: Keep this run's report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_number }}
          path: report/
          if-no-files-found: warn

      - name: Keep the internal unit-check report (not published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-unit-checks-${{ github.run_number }}
          path: report-internal/
          if-no-files-found: warn

      - name: Stage the report for GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: report/

      - name: Verdict
        if: always()
        run: |
          echo "unit=${{ steps.unit.outcome }} kb=${{ steps.kb.outcome }}"
          {
            echo "## Smoke test"
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unit checks | ${{ steps.unit.outcome }} |"
            echo "| LiveKit KB-steps call | ${{ steps.kb.outcome }} |"
            echo ""
            echo "Report: see the **publish** job below for the link, or download the \`smoke-report-${{ github.run_number }}\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.unit.outcome }}" = success
          test "${{ steps.kb.outcome }}" = success

  publish:
    needs: smoke
    if: always() && needs.smoke.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the report (latest run only)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Link the report in the job summary
        run: |
          {
            echo "## Smoke test report"
            echo ""
            echo "**[Open the report](${{ steps.deployment.outputs.page_url }})** - smoke run ${{ needs.smoke.result == 'success' && 'PASSED' || 'FAILED' }}"
          } >> "$GITHUB_STEP_SUMMARY"
