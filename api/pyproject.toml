[project]
name = "thinknetic-livekit-qa-api"
version = "0.1.0"
description = "API-layer tests for the Thinknetic/Etnyre public product endpoints"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "smoke: fast checks that must pass before anything else runs",
    "live: hits the shared dev environment",
]
